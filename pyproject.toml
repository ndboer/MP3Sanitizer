[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mp3sanitizer"
dynamic = ["version"]
description = "Inventariseer, schoon op en hernoem een muziekcollectie op basis van de bestandsnaam."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "PySide6>=6.7",
    "mutagen>=1.47",
    "rapidfuzz>=3.9",
    "httpx>=0.27",
    "send2trash>=1.8",
    "platformdirs>=4.2",
]

[project.scripts]
mp3sanitizer = "mp3sanitizer.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.6",
    "pre-commit>=3.7",
    "pyinstaller>=6.8",
]

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "mp3sanitizer/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["mp3sanitizer"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
