name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # hatch-vcs heeft de tags nodig
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q -p no:cacheprovider

  release:
    # Alleen bij een versietag: bouwen, smoke-test en de zip als release-asset publiceren.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Build (PyInstaller + smoke-test + zip + handleiding)
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          # Elke stap controleren: in PowerShell telt anders alleen het laatste commando.
          # De Windows-runner faalt af en toe zonder duidelijke reden: één herkansing.
          uv run python scripts/release.py build --version $version
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::warning::Build mislukt (exit $LASTEXITCODE), tweede poging"
            uv run python scripts/release.py build --version $version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          if (-not (Test-Path "dist/Mp3Sanitizer-handleiding-$version.pdf")) { throw "Handleiding ontbreekt" }
          uv run python scripts/release.py notes $version | Out-File -Encoding utf8 release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Mp3Sanitizer ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/mp3sanitizer-*-win64.zip
            dist/Mp3Sanitizer-handleiding-*.pdf
